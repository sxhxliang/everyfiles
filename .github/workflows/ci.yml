name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The library crates have `pinyin` off by default and the CLI turns it
      # on, so a workspace build already sees both sides; this pins it.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      # The native backend's differential check against a real tree.
      - run: cargo run --release -p everyfiles-cli -- verify crates
      - name: fanotify tier (root)
        if: matrix.os == 'ubuntu-latest'
        run: sudo -E "$(command -v cargo)" test -p everyfiles-backend-linux -- --ignored root_

  xcheck:
    name: cross-target type check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # Type-checks each platform backend for the targets this host cannot run.
      # Proves FFI names/signatures/cfg gating; does NOT prove ABI layout or
      # runtime behaviour. The `test` matrix above is where those are covered.
      - run: cargo xtask xcheck

  bench-smoke:
    name: benches compile and run once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: EVERYFILES_BENCH_RECORDS=50000 cargo bench -p everyfiles-core --all-features -- --test

  bench-report:
    name: benchmark report (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p everyfiles-cli
      - name: human-readable
        shell: bash
        run: target/release/everyfiles bench --records 1000000 --iterations 50 --path crates --scan-iterations 3 | tee bench-${{ matrix.os }}.txt
      - name: json
        shell: bash
        run: target/release/everyfiles bench --records 1000000 --iterations 50 --path crates --scan-iterations 3 --json > bench-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-${{ matrix.os }}.*
