name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The native backend's differential check against a real tree.
      - run: cargo run --release -p everyfiles-cli -- verify crates
      - name: fanotify tier (root)
        if: matrix.os == 'ubuntu-latest'
        run: sudo -E "$(command -v cargo)" test -p everyfiles-backend-linux -- --ignored root_

  xcheck:
    name: cross-target type check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # Type-checks each platform backend for the targets this host cannot run.
      # Proves FFI names/signatures/cfg gating; does NOT prove ABI layout or
      # runtime behaviour. The `test` matrix above is where those are covered.
      - run: cargo xtask xcheck

  bench-smoke:
    name: benches compile and run once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: EVERYFILES_BENCH_RECORDS=50000 cargo bench -p everyfiles-core -- --test
